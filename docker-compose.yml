services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daibm_scf}
      POSTGRES_USER: ${POSTGRES_USER:-daibm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daibm_demo_password}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app

  mvp:
    build: .
    ports:
      - "127.0.0.1:${MVP_PORT:-8010}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-daibm_scf}
      POSTGRES_USER: ${POSTGRES_USER:-daibm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daibm_demo_password}
      RESEARCH_ARTIFACT_DIR: /app/artifacts/reference
      RESEARCH_CORE_REQUIRED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:

networks:
  app:
    name: daibm-scf-mvp-network
