[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daibm-scf-mvp"
version = "0.1.0"
description = "Minimal scenario MVP for an auditable supply-chain finance risk loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.115,<1",
  "numpy>=2.5,<3",
  "onnxruntime>=1.28,<2",
  "psycopg[binary]>=3.3,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0,<3",
  "pytest>=8,<10",
  "testcontainers[postgres]>=4.13,<5",
]
research = [
  "onnx>=1.22,<2",
  "scikit-learn>=1.9,<2",
  "torch>=2.13,<3",
  "xgboost>=3.4,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "research*"]
