[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daibm-scf-mvp"
version = "0.6.0"
description = "Bilingual multi-role supply-chain finance workflow and auditable research MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.115,<1",
  "numpy>=2.5,<3",
  "onnxruntime>=1.28,<2",
  "psycopg[binary]>=3.3,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0,<3",
  "playwright>=1.62,<2",
  "pypdf>=6.16,<7",
  "pytest>=8,<10",
  "reportlab>=5,<6",
  "testcontainers[postgres]>=4.13,<5",
]
research = [
  "matplotlib>=3.11,<4",
  "onnx>=1.22,<2",
  "onnxscript>=0.7,<1",
  "scikit-learn>=1.9,<2",
  "scipy>=1.18,<2",
  "torch>=2.13,<3",
  "xgboost>=3.4,<4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pyflakes and syntax errors only. This gates real defects -- unused names,
# shadowed builtins, undefined references -- without imposing a formatting
# opinion on a codebase that is already internally consistent.
select = ["F", "E9"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["app"]

[[tool.mypy.overrides]]
# The offline research pipeline is checked by its own tests rather than by
# mypy: its numpy dtype annotations are not yet precise enough to gate on,
# and `app` only imports it for artifact verification. Narrowing the gate to
# `app` keeps it meaningful today instead of permanently advisory.
module = "research.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "research*"]
