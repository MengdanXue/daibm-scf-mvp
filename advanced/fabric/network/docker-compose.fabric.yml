name: daibm-fabric-demo

services:
  bootstrap:
    image: hyperledger/fabric-tools:2.5.16
    command: ["bash", "/network/bootstrap.sh"]
    environment:
      FABRIC_CFG_PATH: /network
    volumes:
      - ./crypto-config.yaml:/network/crypto-config.yaml:ro
      - ./configtx.yaml:/network/configtx.yaml:ro
      - ./bootstrap.sh:/network/bootstrap.sh:ro
      - ../../../output/fabric:/network/output/fabric
    networks:
      - fabric

  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5.16
    container_name: daibm-fabric-orderer
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer-artifacts/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer-artifacts/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer-artifacts/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer-artifacts/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt]'
      ORDERER_GENERAL_GENESISMETHOD: file
      ORDERER_GENERAL_GENESISFILE: /var/hyperledger/orderer-artifacts/genesis.block
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer-artifacts/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer-artifacts/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer-artifacts/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt]'
    command: orderer
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:17050:7050"
    volumes:
      - ../../../output/fabric:/var/hyperledger/orderer-artifacts:ro
      - ../../../output/fabric/state/orderer:/var/hyperledger/production/orderer
    networks:
      fabric:
        aliases:
          - orderer.example.com

  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.5.16
    container_name: daibm-fabric-peer0-org1
    environment:
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_ID: peer0.org1.example.com
      CORE_PEER_ADDRESS: peer0.org1.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.example.com:7051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.example.com:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /var/hyperledger/fabric-artifacts/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /var/hyperledger/fabric-artifacts/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /var/hyperledger/fabric-artifacts/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /var/hyperledger/fabric-artifacts/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: daibm-fabric-demo-network
    command: peer node start
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      orderer.example.com:
        condition: service_started
    ports:
      - "127.0.0.1:17051:7051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../../../output/fabric:/var/hyperledger/fabric-artifacts:ro
      - ../../../output/fabric/state/peer:/var/hyperledger/production
    networks:
      fabric:
        aliases:
          - peer0.org1.example.com

  cli:
    image: hyperledger/fabric-tools:2.5.16
    container_name: daibm-fabric-cli
    command: ["sleep", "infinity"]
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/fabric
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_ADDRESS: peer0.org1.example.com:7051
      CORE_PEER_MSPCONFIGPATH: /network/output/fabric/crypto-config/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_ROOTCERT_FILE: /network/output/fabric/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
    depends_on:
      peer0.org1.example.com:
        condition: service_started
    working_dir: /network
    volumes:
      - ./deploy-chaincode.sh:/network/deploy-chaincode.sh:ro
      - ../../../output/fabric:/network/output/fabric
      - ../chaincode:/chaincode:ro
    networks:
      - fabric

networks:
  fabric:
    name: daibm-fabric-demo-network
