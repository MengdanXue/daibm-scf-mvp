name: application-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install application test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set up real prover runtime for workflow integration
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install real prover for HTTP and PostgreSQL integration
        working-directory: advanced/zkp
        run: npm ci --no-audit --no-fund

      - name: Verify promoted research artifact
        run: python -m research.cli verify --reference artifacts/reference

      - name: Run defense document and preflight contracts
        run: python -m pytest tests/test_defense_documents.py tests/test_defense_preflight.py tests/test_release_contract.py -q

      - name: Run application and PostgreSQL integration tests
        env:
          RUN_ZKP_WORKFLOW_INTEGRATION: "1"
        run: python -m pytest tests --ignore=tests/research --ignore=tests/test_defense_documents.py --ignore=tests/test_defense_preflight.py --ignore=tests/test_release_contract.py -q

  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt

      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt

      - name: Run research tests
        run: python -m pytest tests/research -q

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install application test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint for unused names, shadowed builtins, and syntax errors
        run: python -m ruff check .

      - name: Type-check the application package
        run: python -m mypy

  advanced-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            advanced/fabric/chaincode/package-lock.json
            advanced/zkp/package-lock.json

      - name: Install and test the audit anchor chaincode
        working-directory: advanced/fabric/chaincode
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Install zero-knowledge proof dependencies
        working-directory: advanced/zkp
        run: npm ci --no-audit --no-fund

      - name: Verify published proof artifact hashes
        working-directory: advanced/zkp
        run: npm run verify:artifacts

      - name: Run invoice-limit Groth16 proof tests
        working-directory: advanced/zkp
        run: npm test

      - name: Verify actual read-only prover image
        run: |
          docker build -t daibm-zkp-ci:local advanced/zkp
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            daibm-zkp-ci:local node scripts/container-acceptance.mjs

      # The gateway suite includes a container integration test that asserts the
      # entrypoint drops privileges to the unprivileged node user. It therefore
      # needs the pinned runtime image with the package mounted at /work, which
      # is the same reproducible convention used by scripts/build-zkp-artifacts.ps1.
      - name: Run gateway tests in the pinned Node image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/advanced/gateway:/work" \
            -w /work \
            node:24-bookworm-slim \
            sh -lc "npm ci --no-audit --no-fund && npm test"
