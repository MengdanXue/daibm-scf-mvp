name: application-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install application test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify promoted research artifact
        run: python -m research.cli verify --reference artifacts/reference

      - name: Run application and PostgreSQL integration tests
        run: python -m pytest tests --ignore=tests/research -q
